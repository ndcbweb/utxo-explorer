name: Build, test and publish bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json

      - run: bash scripts/bundle.sh

      - name: Load the nadcab-coind image
        run: curl -fsSL https://github.com/ndcbweb/utxo-chain/releases/download/latest/utxo-chain.tar.gz | gunzip | docker load

      - name: End-to-end test against a live chain
        run: bash test/e2e.sh

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Rolling build of main. Download explorer.tar.gz and run explorer/run.sh."
          gh release upload latest dist/explorer.tar.gz --clobber
          gh release edit latest --notes "Rolling build of main at ${GITHUB_SHA::7}. Download explorer.tar.gz and run explorer/run.sh."
